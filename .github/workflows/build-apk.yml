name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 9.3.1  # Đã nâng cấp lên đúng yêu cầu của dự án
          
      - name: Create .env file
        run: cp .env.example .env
        
      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace --no-configuration-cache -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProjectAPP-debug
          path: app/build/outputs/apk/debug/app-debug.apk
